controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    robot_cr5_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    update_rate: 100
robot_cr5_controller:
  ros__parameters:
    command_interfaces:
    - position
    joints:
    - robot_cr5_joint_1
    - robot_cr5_joint_2
    - robot_cr5_joint_3
    - robot_cr5_joint_4
    - robot_cr5_joint_5
    - robot_cr5_joint_6
    state_interfaces:
    - position
    - velocity
