apiVersion: v1
kind: Namespace
metadata:
  name: xiongyanfei
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unilabos-local-debug
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: unilabos-local-debug
    app.kubernetes.io/part-of: uni-lab-szlab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: unilabos-local-debug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unilabos-local-debug
        app.kubernetes.io/part-of: uni-lab-szlab
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 57439
        runAsGroup: 57439
        fsGroup: 57439
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unilabos
          image: unilabos-szlab-local-debug:1f421617-8543f1a-r2
          imagePullPolicy: Never
          args:
            - unilab
            - --workspace
            - /opt/runtime-src/szlab
            - --graph
            - /opt/runtime-src/szlab/deployment/graphs/szlab-local-debug.json
            - --config
            - /opt/runtime-src/szlab/deployment/local_config.py
            - --working_dir
            - /runtime
            - --control_plane
            - local
            - --backend
            - ros
            - --app_bridges
            - fastapi
            - --port
            - "18003"
            - --disable_browser
          env:
            - name: ROS_DOMAIN_ID
              value: "78"
            - name: ROS_LOCALHOST_ONLY
              value: "0"
            # 本阶段只部署 Uni-Lab-OS；PLC-Sim 就绪后移除此覆盖并滚动重启。
            - name: SZLAB_PLC_AUTO_CONNECT
              value: "false"
          ports:
            - name: http
              containerPort: 18003
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime
              mountPath: /runtime
      volumes:
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: unilabos-local-debug
  namespace: xiongyanfei
  labels:
    app.kubernetes.io/name: unilabos-local-debug
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: unilabos-local-debug
  ports:
    - name: http
      port: 18003
      targetPort: http
      nodePort: 30183
